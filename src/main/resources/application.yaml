# Toda configuração sensível ou dependente de ambiente vem de variáveis de ambiente.
# Em desenvolvimento, copie .env.example para .env (não versionado) — ele é importado abaixo.
spring:
  application:
    name: reten
  config:
    import: optional:file:.env[.properties]

  datasource:
    # RETEN_DB_PARAMS acrescenta parâmetros à URL; em produção (Supabase): ?sslmode=require
    url: jdbc:postgresql://${RETEN_DB_HOST:localhost}:${RETEN_DB_PORT:5434}/${RETEN_DB_NAME:reten}${RETEN_DB_PARAMS:}
    username: ${RETEN_DB_USER:reten}
    password: ${RETEN_DB_PASSWORD:}
    hikari:
      # Bancos gratuitos aceitam poucas conexões; em produção use 5.
      maximum-pool-size: ${RETEN_DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o schema é responsabilidade exclusiva do Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

  # Threads virtuais: a geração assíncrona (@Async) passa a maior parte do tempo esperando a IA.
  threads:
    virtual:
      enabled: true

  # Sessões guardadas no Postgres; as tabelas são criadas pelo Flyway (V3).
  session:
    timeout: 14d
    jdbc:
      initialize-schema: never

  mail:
    host: ${RETEN_MAIL_HOST:localhost}
    port: ${RETEN_MAIL_PORT:1026}
    username: ${RETEN_MAIL_USERNAME:}
    password: ${RETEN_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${RETEN_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${RETEN_MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

server:
  # PORT é definida pelo Render; localmente vale RETEN_SERVER_PORT.
  port: ${PORT:${RETEN_SERVER_PORT:8090}}
  error:
    include-stacktrace: never
    include-message: never

reten:
  frontend-url: ${RETEN_FRONTEND_URL:http://127.0.0.1:5173}
  # Cookie RETEN_SESSION: HttpOnly e SameSite=Lax sempre (ver SessionConfig); Secure em produção (HTTPS).
  session:
    cookie-secure: ${RETEN_COOKIE_SECURE:false}
  security:
    token-encryption-key: ${RETEN_TOKEN_ENCRYPTION_KEY:}
  password-reset:
    ttl: 30m
  # Código de 6 dígitos enviado no cadastro; sem ele o app fica bloqueado.
  email-verification:
    required: ${RETEN_EMAIL_VERIFICATION_REQUIRED:true}
    code-ttl: 15m
    max-attempts: 5
    resend-after: 60s
    max-per-hour: 5
  # Conta de administrador criada ao subir a API (num banco novo ou se ainda não existir).
  # Sem as duas variáveis, nenhuma conta é criada. Em produção, use uma senha forte e própria.
  admin:
    email: ${RETEN_ADMIN_EMAIL:}
    password: ${RETEN_ADMIN_PASSWORD:}
  mail:
    from: ${RETEN_MAIL_FROM:Resten <nao-responda@reten.local>}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-mini}
    # Vazio para modelos sem raciocínio (ex.: gpt-4.1); low/medium/high para modelos de raciocínio.
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
  generation:
    daily-limit: ${RETEN_GENERATION_DAILY_LIMIT:10}
    max-playlists: ${RETEN_MAX_PLAYLISTS:5}
    track-count: 24
  books:
    # Sem chave, a busca usa o Open Library. Com chave, usa o Google Books (sinopses melhores em português).
    google-api-key: ${GOOGLE_BOOKS_API_KEY:}
  spotify:
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    redirect-uri: ${SPOTIFY_REDIRECT_URI:http://127.0.0.1:5173/api/spotify/callback}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.Reaten: ${RETEN_LOG_LEVEL:INFO}

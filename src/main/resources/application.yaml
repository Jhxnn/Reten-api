# Toda configuração sensível ou dependente de ambiente vem de variáveis de ambiente.
# Em desenvolvimento, copie .env.example para .env (não versionado) — ele é importado abaixo.
spring:
  application:
    name: reten
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${RETEN_DB_HOST:localhost}:${RETEN_DB_PORT:5434}/${RETEN_DB_NAME:reten}
    username: ${RETEN_DB_USER:reten}
    password: ${RETEN_DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o schema é responsabilidade exclusiva do Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${RETEN_SERVER_PORT:8090}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.Reaten: ${RETEN_LOG_LEVEL:INFO}
